name: Travis

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-18.04, ubuntu-20.04, macos-latest]
    runs-on: ${{ matrix.os }}
    # The std build and the samples must use the same target version. Without this, mrustc runs in 1.29 mode and
    # samples/test/tait.rs (MaybeUninit, 1.36+) fails to resolve its use.
    env:
      MRUSTC_TARGET_VER: "1.90"
      RUSTC_VERSION: "1.90.0"

    steps:
    - uses: actions/checkout@v2
    - name: Install packages
      run: sudo apt install g++ zlib1g-dev valgrind
      if: startsWith(matrix.os, 'ubuntu')
    - run: make RUSTCSRC
    - run: make -j$(nproc)
    - run: make -j$(nproc) -C tools/minicargo
    - run: make -j$(nproc) -C tools/mir_opt_test
    - run: make -j$(nproc) -C tools/mir_opt_test run
    - run: make -j$(nproc) -f minicargo.mk output/libtest.rlib      # libstd
    - run: make test    # hello_world
    - run: make local_tests -k
    # mrustc's stderr for a failing sample goes to these logs, not to the job log
    - name: keep test build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ matrix.os }}
        path: output/local_tests/*.log
        if-no-files-found: ignore
